[platformio]
default_envs = prepare-bluedroid, waveshare-1_85b-usb-mic
core_dir = .pio-core
boards_dir = boards
src_dir = ../src
include_dir = ../include
lib_dir = ../lib

; UAC support requires Arduino-ESP32 3.3.11. This isolated project cache keeps
; V2 and the normal V3 recovery build pinned to their proven 3.2.1 toolchain.
[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = waveshare-1_85b-usb-mic
framework = arduino
extra_scripts =
  pre:add_bluedroid_api.py
custom_sdkconfig =
  CONFIG_BT_BLUEDROID_ENABLED=y
  CONFIG_BT_NIMBLE_ENABLED=n
  CONFIG_BT_CLASSIC_ENABLED=n
  CONFIG_BT_BLE_50_FEATURES_SUPPORTED=n
  CONFIG_BT_BLE_42_FEATURES_SUPPORTED=y
  CONFIG_BT_BLE_SMP_ENABLE=y
board_build.partitions = partitions/default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  bblanchon/ArduinoJson @ ^6.21.5
  lvgl/lvgl @ 8.4.0
build_flags =
  -DBOARD_HAS_PSRAM
  -DLV_CONF_INCLUDE_SIMPLE
  -I../include
  -DCORE_DEBUG_LEVEL=1

; The first pass makes pioarduino generate Bluedroid framework libraries. It
; intentionally does not enable TinyUSB audio yet.
[env:prepare-bluedroid]

[env:waveshare-1_85b-usb-mic]
build_flags =
  ${env.build_flags}
  -DCODEX_MACRO32_USB_MIC=1
  -DCONFIG_TINYUSB_ENABLED=1
  -DCONFIG_TINYUSB_AUDIO_ENABLED=1
  -DCONFIG_TINYUSB_CDC_ENABLED=1
  -DCONFIG_TINYUSB_CDC_MAX_PORTS=1
  -DCONFIG_TINYUSB_CDC_RX_BUFSIZE=256
  -DCONFIG_TINYUSB_CDC_TX_BUFSIZE=256
  ; Arduino's retained TinyUSB archive contains every dispatcher. These flags
  ; keep that archive linkable. The firmware advertises UAC microphone plus a
  ; maintenance-only CDC interface; it never advertises USB HID or keyboard.
  -DCONFIG_TINYUSB_HID_ENABLED=1
  -DCONFIG_TINYUSB_HID_BUFSIZE=64
  -DCONFIG_TINYUSB_MSC_ENABLED=1
  -DCONFIG_TINYUSB_MSC_BUFSIZE=4096
  -DCONFIG_TINYUSB_DFU_ENABLED=1
  -DCONFIG_TINYUSB_DFU_BUFSIZE=4096
  -DCONFIG_TINYUSB_DFU_RT_ENABLED=1
  -DCONFIG_TINYUSB_NCM_ENABLED=1
  -Wl,--wrap=tinyusb_add_string_descriptor

; Deterministic 1 kHz source for USB transport tests. It is never selected by
; the default build or flash command.
[env:waveshare-1_85b-usb-mic-synthetic]
extends = env:waveshare-1_85b-usb-mic
build_flags =
  ${env:waveshare-1_85b-usb-mic.build_flags}
  -DCODEX_MACRO32_USB_MIC_SYNTHETIC=1
